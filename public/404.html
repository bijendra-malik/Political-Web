<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bijendra Malik</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Stores the full path in sessionStorage and redirects to root
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    // Only redirect if it's a real sub-route, not a missing asset
    if (path && path !== '/') {
      sessionStorage.setItem('redirectPath', path + search + hash);
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
